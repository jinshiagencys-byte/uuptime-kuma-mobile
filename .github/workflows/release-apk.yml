name: Build & Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 🏗 Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🔐 Create .env file
        run: |
          echo "EXPO_PUBLIC_RELAY_URL=${{ secrets.EXPO_PUBLIC_RELAY_URL }}" >> .env
          echo "EXPO_PUBLIC_RELAY_SECRET=${{ secrets.EXPO_PUBLIC_RELAY_SECRET }}" >> .env

      - name: 🚀 Build APK (Local)
        run: eas build --platform android --profile preview --non-interactive --local --output app-release.apk

      - name: 🏷 Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: app-release.apk
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
